<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Portofolio - JTI NOVA</title>

    <link rel="stylesheet" href="../../../Style/style.css">

    <style>
        .detail-page-section {
            padding: var(--space-48) 0 var(--space-80);
            background-color: var(--bg-white);
        }

        .dt-hero__back {
            display: inline-flex;
            color: var(--text-primary);
            border-radius: 50%;
            margin-bottom: var(--space-24);
        }

        .dt-hero__back svg {
            width: 44px;
            height: 44px;
            fill: none;
            stroke: currentColor;
        }

        .dt-hero__back:focus-visible {
            outline: 2px solid var(--brand-teal);
            outline-offset: 3px;
        }

        .detail-hero-banner {
            width: 100%;
            height: 380px;
            border-radius: var(--radius-card);
            overflow: hidden;
            background-color: var(--brand-primary);
            margin-bottom: var(--space-48);
            position: relative;
            box-shadow: var(--shadow-card);
        }

        .detail-hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .detail-layout-grid {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 48px;
            align-items: start;
        }

        .detail-main-content {
            display: flex;
            flex-direction: column;
        }

        .detail-main-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 var(--space-24);
            font-family: 'Inter', sans-serif;
            line-height: 1.25;
        }

        .detail-paragraph {
            font-size: 14.5px;
            line-height: 1.75;
            color: var(--text-secondary);
            margin: 0 0 var(--space-24);
            font-family: 'Inter', sans-serif;
            text-align: justify;
        }

        .detail-sidebar-card {
            background-color: var(--bg-white);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-default);
            box-shadow: var(--shadow-card);
            padding: 32px 28px;
            position: sticky;
            top: 96px;
        }

        .sidebar-card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--brand-primary);
            margin: 0 0 var(--space-16);
            font-family: 'Inter', sans-serif;
        }

        .sidebar-card-desc {
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--text-secondary);
            margin: 0 0 var(--space-16);
            font-family: 'Inter', sans-serif;
        }

        .sidebar-contact-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: var(--space-24);
            font-size: 13.5px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }

        .sidebar-contact-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sidebar-contact-label {
            color: var(--text-secondary);
        }

        .sidebar-contact-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .sidebar-card-hours {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0 0 var(--space-24);
            font-family: 'Inter', sans-serif;
        }

        .sidebar-btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        html { -webkit-text-size-adjust: 100%; }
        body { overflow-x: clip; margin: 0; }
        img  { max-width: 100%; }

        .detail-layout-grid > *,
        .detail-main-content > * { min-width: 0; }

        .detail-main-title { overflow-wrap: anywhere; }
        .detail-paragraph { overflow-wrap: break-word; }

        .sidebar-contact-item { flex-wrap: wrap; }
        .sidebar-contact-value { overflow-wrap: anywhere; }

        @media (max-width: 1280px) {
            .container {
                padding-left: 64px;
                padding-right: 64px;
            }

            .navbar .navbar-container {
                padding-left: 64px;
                padding-right: 64px;
            }

            body .carousel-wrapper .carousel-content-wrap {
                padding-left: 64px;
                padding-right: 64px;
            }
        }

        @media (min-width: 901px) and (max-width: 1100px) {
            .navbar .navbar-menu-wrapper {
                gap: 16px;
            }

            .navbar .navbar-menu {
                gap: 16px;
            }

            .navbar .nav-link {
                font-size: 14px;
            }
        }

        @media (max-width: 1024px) {
            .container {
                padding-left: 40px;
                padding-right: 40px;
            }

            .navbar .navbar-container {
                padding-left: 40px;
                padding-right: 40px;
            }

            body .carousel-wrapper .carousel-content-wrap {
                padding-left: 40px;
                padding-right: 40px;
            }

            .detail-page-section {
                padding: 40px 0 64px;
            }

            .detail-hero-banner {
                height: 320px;
                margin-bottom: 40px;
            }

            .detail-layout-grid {
                gap: 32px;
            }

            .detail-main-title {
                font-size: 32px;
            }

            .detail-sidebar-card {
                padding: 28px 24px;
            }
        }

        @media (max-width: 900px) {
            .navbar .navbar-container {
                padding-left: 24px;
                padding-right: 24px;
            }

            .detail-layout-grid {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .detail-sidebar-card {
                position: static;
            }

            .detail-hero-banner {
                height: 260px;
            }

            .detail-main-title {
                font-size: 28px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding-left: 24px;
                padding-right: 24px;
            }

            body .carousel-wrapper .carousel-content-wrap {
                padding: 72px 24px 48px;
            }

            .detail-page-section {
                padding: 32px 0 52px;
            }

            .dt-hero__back svg {
                width: 40px;
                height: 40px;
            }

            .dt-hero__back {
                margin-bottom: 20px;
            }

            .detail-hero-banner {
                margin-bottom: 32px;
            }

            .detail-main-title {
                margin-bottom: 20px;
            }

            .detail-sidebar-card {
                max-width: 520px;
            }
        }

        @media (max-width: 640px) {
            /* Hero carousel ringkas: tinggi mengikuti isi (tidak dikunci 540px lagi) */
            body .carousel-wrapper {
                height: auto;
                min-height: 300px;
            }

            body .carousel-wrapper .carousel-content-wrap {
                height: auto;
                min-height: 300px;
                padding: 68px 16px 44px;
            }

            body .carousel-wrapper .carousel-text-box {
                min-height: 0;
            }

            body .carousel-wrapper .carousel-title {
                font-size: clamp(19px, 5.6vw, 22px);
                min-height: 0;
                margin-bottom: 8px;
            }

            body .carousel-wrapper .carousel-desc {
                font-size: 12.5px;
                line-height: 1.5;
                min-height: 0;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            body .carousel-wrapper .carousel-buttons {
                flex-direction: row;
                flex-wrap: wrap;
                width: auto;
                gap: 8px;
                margin-top: 14px;
            }

            body .carousel-wrapper .carousel-hero-btn,
            body .carousel-wrapper .carousel-buttons .blob-btn {
                width: auto !important;
                flex: 0 0 auto !important;
                height: 38px !important;
                min-height: 38px !important;
                padding: 0 18px !important;
                font-size: 12.5px !important;
            }

            .detail-paragraph {
                text-align: left;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding-left: 16px;
                padding-right: 16px;
            }

            .navbar .navbar-container {
                padding-left: 16px;
                padding-right: 16px;
            }

            body .carousel-wrapper .carousel-content-wrap {
                padding: 68px 16px 44px;
            }

            body .mobile-overlay {
                padding: 84px 24px 32px;
            }

            .mobile-overlay .mobile-nav-link {
                font-size: 18px;
                padding: 12px 0;
            }

            .mobile-overlay .mobile-dropdown-link {
                font-size: 16px;
            }

            .detail-page-section {
                padding: 28px 0 44px;
            }

            .dt-hero__back svg {
                width: 36px;
                height: 36px;
            }

            .detail-hero-banner {
                height: 200px;
                margin-bottom: 28px;
            }

            .detail-main-title {
                font-size: 24px;
            }

            .detail-paragraph {
                font-size: 14px;
                line-height: 1.7;
                margin-bottom: 20px;
            }

            .detail-sidebar-card {
                padding: 24px 20px;
                max-width: none;
            }

            .sidebar-card-title {
                font-size: 18px;
            }
        }

        @media (max-width: 380px) {
            .detail-hero-banner {
                height: 180px;
            }
        }
    </style>
</head>

            var footerContainer = document.getElementById("footer-container");
            if (footerContainer && typeof window.mountFooter === "function") {
                window.mountFooter(footerContainer, { current_page: "portofolio", base_url: baseUrl });
            }
        })();
    </script>

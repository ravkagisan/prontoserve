<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jtinova - Anggota Tim</title>

    <link rel="stylesheet" href="../../../Style/style.css">

    <style>
    .at-hero {
        background-color: var(--bg-soft);
        padding-top: calc(var(--space-48) + var(--space-8));
        padding-bottom: calc(var(--space-48) + var(--space-8));
    }

    .at-hero__back {
        display: inline-flex;
        color: var(--text-primary);
        border-radius: 50%;
    }

    .at-hero__back svg {
        width: 44px;
        height: 44px;
        fill: none;
        stroke: currentColor;
    }

    .at-hero__back:focus-visible {
        outline: 2px solid var(--brand-teal);
        outline-offset: 3px;
    }

    .at-hero__crumb {
        margin: calc(var(--space-24) + var(--space-16)) 0 calc(var(--space-24) + var(--space-8));
        color: var(--text-secondary);
    }

    .at-hero__crumb a {
        color: inherit;
        text-decoration: none;
    }

    .at-hero__crumb a:hover {
        text-decoration: underline;
    }

    .at-hero__title {
        margin: 0 0 calc(var(--space-24) + var(--space-8));
        color: var(--brand-primary);
    }

    .at-hero__desc {
        margin: 0;
        color: var(--text-secondary);
    }

    .at-profile {
        padding-top: calc(var(--space-24) + var(--space-8));
        padding-bottom: calc(var(--space-48) + var(--space-16));
    }

    .at-profile__grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        align-items: center;
        gap: 60px;
    }

    .at-profile__photo {
        width: 360px;
        height: 485px;
        object-fit: cover;
        display: block;
        border-radius: var(--radius-card);
        background-color: var(--bg-gray);
    }

    .at-profile__list {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 20px;
        font-weight: 400;
        line-height: 37px;
        color: var(--text-primary);
    }

    .at-profile__list strong {
        font-weight: 700;
        color: var(--text-primary);
    }

    .at-back {
        padding-top: 28px;
    }

    .at-back .at-hero__back {
        transition: transform 0.2s ease, color 0.2s ease;
    }

    .at-back .at-hero__back:hover {
        color: var(--brand-primary);
        transform: translateX(-3px);
    }

    @media (max-width: 768px) {
        .at-back {
            padding-top: 20px;
        }

        .at-back .at-hero__back svg {
            width: 40px;
            height: 40px;
        }
    }

    @media (max-width: 480px) {
        .at-back .at-hero__back svg {
            width: 36px;
            height: 36px;
        }
    }

    @media (hover: none) {
        .at-back .at-hero__back:hover {
            transform: none;
        }
    }

    html { -webkit-text-size-adjust: 100%; }
    body { overflow-x: clip; }
    img  { max-width: 100%; }

    .at-profile__grid > * { min-width: 0; }
    .at-profile__list li { overflow-wrap: break-word; }
    .at-hero__title { overflow-wrap: anywhere; }

    @media (max-width: 1280px) {
        .container {
            padding-left: 64px;
            padding-right: 64px;
        }

        .navbar .navbar-container {
            padding-left: 64px;
            padding-right: 64px;
        }

        body .carousel-wrapper .carousel-content-wrap {
            padding-left: 64px;
            padding-right: 64px;
        }
    }

    @media (min-width: 901px) and (max-width: 1100px) {
        .navbar .navbar-menu-wrapper {
            gap: 16px;
        }

        .navbar .navbar-menu {
            gap: 16px;
        }

        .navbar .nav-link {
            font-size: 14px;
        }
    }

    @media (max-width: 1024px) {
        .container,
        .at-hero .container,
        .at-profile .container {
            padding-left: 40px;
            padding-right: 40px;
        }

        .navbar .navbar-container {
            padding-left: 40px;
            padding-right: 40px;
        }

        body .carousel-wrapper .carousel-content-wrap {
            padding-left: 40px;
            padding-right: 40px;
        }

        .at-hero {
            padding-top: 48px;
            padding-bottom: 48px;
        }

        .at-profile {
            padding-top: 28px;
            padding-bottom: 56px;
        }

        .at-profile__grid {
            grid-template-columns: minmax(240px, 300px) 1fr;
            gap: 40px;
        }

        .at-profile__photo {
            width: 100%;
            height: auto;
            aspect-ratio: 360 / 485;
        }

        .at-profile__list {
            font-size: 18px;
            line-height: 1.8;
        }
    }

    @media (max-width: 900px) {
        .navbar .navbar-container {
            padding-left: 24px;
            padding-right: 24px;
        }
    }

    @media (max-width: 768px) {
        .container,
        .at-hero .container,
        .at-profile .container {
            padding-left: 24px;
            padding-right: 24px;
        }

        body .carousel-wrapper .carousel-content-wrap {
            padding: 72px 24px 48px;
        }

        .at-hero {
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .at-hero__title {
            font-size: 32px;
        }

        .at-profile {
            padding-top: 24px;
            padding-bottom: 44px;
        }

        .at-profile__grid {
            grid-template-columns: minmax(180px, 220px) 1fr;
            gap: 28px;
        }

        .at-profile__list {
            font-size: 16px;
            line-height: 1.75;
        }
    }

    @media (max-width: 640px) {
        body .carousel-wrapper {
            height: 540px;
        }

        .at-profile__grid {
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: start;
        }

        .at-profile__photo {
            max-width: 360px;
        }

        .at-profile__list {
            font-size: 15px;
            line-height: 1.7;
        }

        .at-profile__list li + li {
            margin-top: 6px;
        }
    }

    @media (max-width: 480px) {
        .container,
        .at-hero .container,
        .at-profile .container {
            padding-left: 16px;
            padding-right: 16px;
        }

        .navbar .navbar-container {
            padding-left: 16px;
            padding-right: 16px;
        }

        body .carousel-wrapper .carousel-content-wrap {
            padding: 72px 16px 48px;
        }

        body .mobile-overlay {
            padding: 84px 24px 32px;
        }

        .mobile-overlay .mobile-nav-link {
            font-size: 18px;
            padding: 12px 0;
        }

        .mobile-overlay .mobile-dropdown-link {
            font-size: 16px;
        }

        .at-hero__title {
            font-size: 28px;
        }

        .at-profile__photo {
            max-width: 100%;
        }
    }

    @media (max-width: 380px) {
        body .carousel-wrapper {
            height: 580px;
        }

        .at-profile__list {
            font-size: 14.5px;
        }
    }
    </style>
</head>

<body>

    <div id="navbar-container"></div>

    <div id="carousel-container"></div>

    <section class="at-back">
        <div class="container">
            <a href="../index.html#anggota" id="back-to-tim" class="at-hero__back" aria-label="Kembali ke halaman Tim">
                <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12.5 8l-4 4 4 4M8.5 12h7.5"/>
                </svg>
            </a>
        </div>
    </section>

    <section class="at-profile">
        <div class="container at-profile__grid">
            <img class="at-profile__photo"
                 id="profile-photo"
                 src="../../../Assets/images/dummy.jpg"
                 alt="">
            <ul class="at-profile__list" id="profile-list"></ul>
        </div>
    </section>

    <div id="footer-container"></div>

    <script>
        window.current_page = 'tim';
        window.navbar_autorender = false;
        window.carousel_autorender = false;
        window.footer_autorender = false;
    </script>

    <script src="../../../Components/button.js"></script>
    <script src="../../../Components/card.js"></script>
    <script src="../../../Components/carousel.js"></script>
    <script src="../../../Components/navbar.js"></script>
    <script src="../../../Components/footer.js"></script>

    <script>
        (function () {
            "use strict";

            var baseUrl = (typeof window.baseUrl === "string" && window.baseUrl !== "") ? window.baseUrl : "../../..";
            var imagesUrl = baseUrl + "/Assets/images/";
            var fallbackImg = imagesUrl + "dummy.jpg";

            var timUrl = baseUrl + "/Pages/Tim/index.html";
            var hubungiUrl = baseUrl + "/Pages/HubungiKami/index.html";

            var fotoAnggota = {
                1: "suki.png",
                2: "suki2.png",
                3: "suki3.png",
                4: "suki4.png",
                5: "suki5.png",
                6: "tim-6.jpg",
                7: "tim-7.jpg",
                8: "tim-8.jpg"
            };

            var anggotaKatalog = {
                1: {
                    id: 1,
                    foto: fotoAnggota[1],
                    nama: "Dr. Aria Wiguna, M.T.",
                    jabatan: "Instruktur Senior",
                    bidang: "Rekayasa Perangkat Lunak dan Data Science",
                    npwp: "12.345.678.9-012.000",
                    nidn: "0412038502",
                    email: "aria.wiguna@contohinstansi.com",
                    telepon: "0812-3456-7890",
                    pendidikan: "S2 Teknik Informatika, Universitas Teknologi Nusantara",
                    sertifikasi: "Certified Python Developer, AWS Certified Solutions Architect",
                    pengalaman: "8 Tahun sebagai praktisi industri dan pengajar aktif."
                }
            };

            var anggotaLain = {
                2: ["Nama Anggota 2, M.M.",   "Project Manager",    "Manajemen Proyek Teknologi Informasi",    "S2 Manajemen Teknologi, Universitas Teknologi Nusantara",    "PMP, Certified Scrum Master",                     "7 Tahun sebagai project manager dan pengajar aktif."],
                3: ["Nama Anggota 3, M.Des.", "UI/UX Designer",     "UI/UX Design dan Desain Interaksi",       "S2 Desain Komunikasi Visual, Universitas Teknologi Nusantara", "Google UX Design Professional Certificate",       "6 Tahun sebagai desainer produk digital dan pengajar aktif."],
                4: ["Nama Anggota 4, M.Kom.", "Frontend Developer", "Pengembangan Antarmuka Web",              "S2 Teknik Informatika, Universitas Teknologi Nusantara",     "Meta Front-End Developer Certificate",            "5 Tahun sebagai frontend developer dan pengajar aktif."],
                5: ["Nama Anggota 5, M.Kom.", "Backend Developer",  "Pengembangan Sistem dan Basis Data",      "S2 Sistem Informasi, Universitas Teknologi Nusantara",       "Certified Laravel Developer, MySQL Professional", "6 Tahun sebagai backend developer dan pengajar aktif."],
                6: ["Nama Anggota 6, M.T.",   "Mobile Developer",   "Pengembangan Aplikasi Mobile",            "S2 Teknik Informatika, Universitas Teknologi Nusantara",     "Associate Android Developer, Flutter Certified",  "5 Tahun sebagai mobile developer dan pengajar aktif."],
                7: ["Nama Anggota 7, M.T.",   "Network & IoT",      "Jaringan Komputer dan Internet of Things", "S2 Teknik Komputer, Universitas Teknologi Nusantara",       "CCNA, CompTIA Security+",                         "7 Tahun sebagai network engineer dan pengajar aktif."],
                8: ["Nama Anggota 8, M.Sn.",  "Multimedia",         "Produksi Multimedia dan Motion Graphic",  "S2 Desain Media Digital, Universitas Teknologi Nusantara",  "Adobe Certified Professional",                    "6 Tahun sebagai kreator multimedia dan pengajar aktif."]
            };

            Object.keys(anggotaLain).forEach(function (no) {
                var baris = anggotaLain[no];
                anggotaKatalog[no] = {
                    id: Number(no),
                    foto: fotoAnggota[no],
                    nama: baris[0],
                    jabatan: baris[1],
                    bidang: baris[2],
                    npwp: "12.345.678.9-012.00" + no,
                    nidn: "041203850" + no,
                    email: "anggota" + no + "@contohinstansi.com",
                    telepon: "0812-3456-789" + no,
                    pendidikan: baris[3],
                    sertifikasi: baris[4],
                    pengalaman: baris[5]
                };
            });

            var params = new URLSearchParams(window.location.search);
            var id = parseInt(params.get("id") || "1", 10);

            if (!anggotaKatalog[id]) {
                window.location.replace(timUrl + "#anggota");
                return;
            }

            var orang = anggotaKatalog[id];

            var detail = [
                ["Nama Lengkap",           orang.nama],
                ["Jabatan",                orang.jabatan],
                ["Bidang Keahlian",        orang.bidang],
                ["NPWP",                   orang.npwp],
                ["Nomor Induk / NIDN",     orang.nidn],
                ["Email",                  orang.email],
                ["Nomor Telepon",          orang.telepon],
                ["Pendidikan Terakhir",    orang.pendidikan],
                ["Riwayat Sertifikasi",    orang.sertifikasi],
                ["Pengalaman Profesional", orang.pengalaman]
            ];

            var carouselGambar = [
                imagesUrl + "dummy.jpg",
                imagesUrl + "ajasendiri.jpg"
            ];

            var carouselSlides = carouselGambar.map(function (gambar, no) {
                return {
                    id: no + 1,
                    image: gambar,
                    title: orang.nama,
                    description: orang.jabatan + " · " + orang.bidang,
                    buttons: [
                        { text: "Hubungi Kami", link: hubungiUrl, variant: "primary" },
                        { text: "Kembali ke Tim", link: timUrl, variant: "outline-white" }
                    ]
                };
            });

            var navContainer = document.getElementById("navbar-container");
            if (navContainer && typeof window.mountNavbar === "function") {
                window.mountNavbar(navContainer, { current_page: "tim", base_url: baseUrl });
            }

            var carouselContainer = document.getElementById("carousel-container");
            if (carouselContainer && typeof window.mountCarousel === "function") {
                window.mountCarousel(carouselContainer, {
                    carousel_type: "hero",
                    carousel_slides: carouselSlides,
                    auto_slide_interval: 7000
                });
            }

            var backLink = document.getElementById("back-to-tim");
            if (backLink) {
                backLink.href = timUrl + "#anggota";
            }

            var photoEl = document.getElementById("profile-photo");
            if (photoEl) {
                photoEl.src = imagesUrl + orang.foto;
                photoEl.alt = orang.nama;
                photoEl.addEventListener("error", function () {
                    if (photoEl.src !== fallbackImg) {
                        photoEl.src = fallbackImg;
                    }
                });
            }

            var listEl = document.getElementById("profile-list");
            if (listEl) {
                listEl.innerHTML = "";
                detail.forEach(function (item) {
                    var li = document.createElement("li");
                    var strong = document.createElement("strong");
                    strong.textContent = item[0] + ": ";
                    li.appendChild(strong);
                    li.appendChild(document.createTextNode(item[1]));
                    listEl.appendChild(li);
                });
            }

            var footerContainer = document.getElementById("footer-container");
            if (footerContainer && typeof window.mountFooter === "function") {
                window.mountFooter(footerContainer, { current_page: "tim", base_url: baseUrl });
            }
        })();
    </script>

</body>

</html>

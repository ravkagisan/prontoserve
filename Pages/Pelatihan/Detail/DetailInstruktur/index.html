<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Instruktur - JTI NOVA</title>

    <link rel="stylesheet" href="../../../../Style/style.css" />

    <style>
      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        overflow-x: clip;
        margin: 0;
      }

      .at-hero {
        background-color: var(--bg-soft);
        padding-top: calc(var(--space-48) + var(--space-8));
        padding-bottom: calc(var(--space-48) + var(--space-8));
      }

      .at-hero__crumb {
        margin: calc(var(--space-24) + var(--space-16)) 0
          calc(var(--space-24) + var(--space-8));
        color: var(--text-secondary);
      }

      .at-hero__crumb a {
        color: inherit;
        text-decoration: none;
      }

      .at-hero__crumb a:hover {
        text-decoration: underline;
      }

      .at-hero__title {
        margin: 0 0 calc(var(--space-24) + var(--space-8));
        color: var(--brand-primary);
      }

      .at-hero__desc {
        margin: 0;
        color: var(--text-secondary);
      }

      .at-profile {
        padding-top: calc(var(--space-48) + var(--space-8));
        padding-bottom: calc(var(--space-48) + var(--space-24));
        background-color: var(--bg-white);
        box-sizing: border-box;
        width: 100%;
      }

      .at-profile__grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        align-items: center;
        gap: 60px;
        box-sizing: border-box;
        width: 100%;
      }

      .at-profile__photo {
        width: 360px;
        height: 485px;
        object-fit: cover;
        display: block;
        border-radius: var(--radius-card);
        background-color: var(--bg-gray);
        box-shadow: var(--shadow-card);
        box-sizing: border-box;
      }

      .at-profile__list {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 18px;
        font-weight: 400;
        line-height: 36px;
        color: var(--text-primary);
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
      }

      .at-profile__list li {
        overflow-wrap: break-word;
      }

      .at-profile__list strong {
        font-weight: 700;
        color: var(--brand-primary);
      }

      /* Responsivitas Tablet & Layar Menengah (<= 1024px) */
      @media (max-width: 1024px) {
        .at-profile .container {
          padding-left: 40px;
          padding-right: 40px;
        }

        .at-profile__grid {
          grid-template-columns: 1fr;
          gap: 40px;
        }

        .at-profile__photo {
          width: 100%;
          max-width: 360px;
          height: auto;
          aspect-ratio: 360 / 485;
          margin: 0 auto;
        }
      }

      /* Responsivitas Smartphone / Android / iPhone (<= 768px) */
      @media (max-width: 768px) {
        .at-profile .container {
          padding-left: 24px;
          padding-right: 24px;
        }

        .at-profile__list {
          font-size: 15px;
          line-height: 1.8;
        }
      }

      /* Responsivitas Perangkat Sangat Kecil / iPhone SE (<= 480px) */
      @media (max-width: 480px) {
        .at-profile .container {
          padding-left: 16px;
          padding-right: 16px;
        }

        .at-profile__list {
          font-size: 14px;
          line-height: 1.6;
        }
      }
    </style>
  </head>

  <body>
    <div id="navbar-container"></div>

    <div id="carousel-container"></div>

    <section class="at-profile">
      <div class="container at-profile__grid">
        <img class="at-profile__photo" id="instruktur-foto" src="" alt="" />
        <ul class="at-profile__list" id="instruktur-detail"></ul>
      </div>
    </section>

    <div id="cta-container"></div>
    <div id="footer-container"></div>

    <script>
      window.current_page = "pelatihan";
      window.navbar_autorender = false;
      window.carousel_autorender = false;
      window.footer_autorender = false;
    </script>

    <script src="../../../../Components/ctacontainer.js"></script>
    <script src="../../../../Components/button.js"></script>
    <script src="../../../../Components/card.js"></script>
    <script src="../../../../Components/carousel.js"></script>
    <script src="../../../../Components/navbar.js"></script>
    <script src="../../../../Components/footer.js"></script>

    <script>
      (function () {
        "use strict";

        var baseUrl =
          typeof window.baseUrl === "string" && window.baseUrl !== ""
            ? window.baseUrl
            : "../../../..";
        var imagesUrl = baseUrl + "/Assets/images/";
        var pelatihanUrl = baseUrl + "/Pages/Pelatihan/index.html";
        var hubungiUrl = baseUrl + "/Pages/HubungiKami/index.html";

        var instrukturKatalog = {
          1: {
            id: 1,
            foto: "Foto-Instruktur/foto1.jpg",
            nama: "Reza Putra Pradana, S.Kom., M.T",
            prodi: "Teknologi Rekayasa Perangkat Lunak PSDKU Sabu Raijua",
            nidn: "7642775676130242",
            nip: "199703102024061001",
            jabatan: "Asisten Ahli",
            status: "PNS",
            golongan: "Penata Muda Tingkat I / IIIb",
            ttl: "Banyuwangi, 10 Maret 1997",
            email: "reza_pd@polije.ac.id",
          },
          2: {
            id: 2,
            foto: "Foto-Instruktur/foto2.jpg",
            nama: "Reza Putra Pradana, S.Kom., M.T",
            prodi: "Dosen Teknologi Rekayasa Perangkat Lunak PSDKU Sabu Raijua",
            nidn: "0016087806",
            nip: "19780816 200501 1 002",
            jabatan: "Lektor",
            status: "PNS",
            ttl: "16 Agustus 1978",
            email: "beni@polije.ac.id",
          },
          3: {
            id: 3,
            foto: "Foto-Instruktur/foto3.jpg",
            nama: "Muhammad Beni Fajri, S. Tr.Kom",
            nip: "200006062025061011",
            status: "PNS",
            lab: "Rekayasa Perangkat Lunak",
          },
          4: {
            id: 4,
            foto: "Foto-Instruktur/foto4.jpg",
            nama: "Ely Mulyadi, SE, M.Kom",
            prodi: "Dosen Manajemen Informatika",
            nidn: "0017067306",
            nip: "19730617 202321 1 006",
            jabatan: "Asisten Ahli",
            status: "PPPK",
            golongan: "Golongan X (S2/P3K)",
            ttl: "Brebes, 01 Januari 2018",
            email: "elymulyadi@polije.ac.id",
          },
          5: {
            id: 5,
            foto: "Foto-Instruktur/foto5.jpg",
            nama: "Egy Raka Tiony, A.Md",
            nip: "T19960710202105101",
            status: "PPPK",
            lab: "Multimedia Cerdas",
          },
        };

        var params = new URLSearchParams(window.location.search);
        var rawId = params.get("id");
        var parsedId = rawId !== null ? parseInt(rawId, 10) : 1;
        var orang = instrukturKatalog[parsedId] || instrukturKatalog[1];
        var fotoSrc = imagesUrl + (orang.foto || "dummy.jpg");

        document.title = "Profil Instruktur - " + orang.nama + " - JTI NOVA";

        var navContainer = document.getElementById("navbar-container");
        if (navContainer && typeof window.mountNavbar === "function") {
          window.mountNavbar(navContainer, {
            current_page: "pelatihan",
            base_url: baseUrl,
          });
        }

        var keteranganBagian = [
          orang.jabatan,
          orang.prodi,
          orang.lab ? "Lab " + orang.lab : "",
          !orang.jabatan && !orang.prodi && !orang.lab ? orang.status : "",
        ]
          .filter(Boolean)
          .join(" · ");

        var carouselSlides = [
          {
            id: orang.id,
            image: fotoSrc,
            title: orang.nama,
            description: keteranganBagian,
            buttons: [
              { text: "Hubungi Kami", link: hubungiUrl, variant: "primary" },
              {
                text: "Kembali ke Pelatihan",
                link: pelatihanUrl + "#instruktur",
                variant: "outline-white",
              },
            ],
          },
        ];

        var carouselContainer = document.getElementById("carousel-container");
        if (carouselContainer && typeof window.mountCarousel === "function") {
          window.mountCarousel(carouselContainer, {
            carousel_type: "hero",
            carousel_slides: carouselSlides,
          });
        }

        var fotoEl = document.getElementById("instruktur-foto");
        if (fotoEl) {
          fotoEl.src = fotoSrc;
          fotoEl.alt = orang.nama;
          fotoEl.addEventListener("error", function () {
            if (fotoEl.src.indexOf("dummy.jpg") === -1) {
              fotoEl.src = imagesUrl + "dummy.jpg";
            }
          });
        }

        var detailItems = [
          ["Nama Lengkap", orang.nama],
          ["Program Studi", orang.prodi],
          ["NIDN", orang.nidn],
          ["NIP", orang.nip],
          ["Jabatan", orang.jabatan],
          ["Status", orang.status],
          ["Golongan", orang.golongan],
          ["Tempat, Tanggal Lahir", orang.ttl],
          ["Email", orang.email],
          ["Lokasi Lab", orang.lab],
        ].filter(([label, value]) => value);

        var listEl = document.getElementById("instruktur-detail");
        if (listEl) {
          listEl.textContent = "";
          detailItems.forEach(function (pair) {
            var li = document.createElement("li");
            var strong = document.createElement("strong");
            strong.textContent = pair[0] + ": ";

            li.appendChild(strong);
            li.appendChild(document.createTextNode(pair[1]));
            listEl.appendChild(li);
          });
        }

        var ctaContainer = document.getElementById("cta-container");
        if (ctaContainer && typeof window.mountCta === "function") {
          window.mountCta(ctaContainer, {
            title: "Tertarik mengikuti pelatihan ini?",
            subtitle:
              "Hubungi tim JTI NOVA untuk informasi pendaftaran, jadwal kelas, dan konsultasi program.",
            btn_text: "Hubungi Kami",
            btn_href: hubungiUrl,
            variant: "dark",
          });
        }

        var footerContainer = document.getElementById("footer-container");
        if (footerContainer && typeof window.mountFooter === "function") {
          window.mountFooter(footerContainer, {
            current_page: "pelatihan",
            base_url: baseUrl,
          });
        }
      })();
    </script>
  </body>
</html>

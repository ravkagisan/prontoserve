<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Instruktur - JTI NOVA</title>

    <link rel="stylesheet" href="../../../../Style/style.css">

    <style>
        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            overflow-x: clip;
            margin: 0;
        }

        .at-hero {
            background-color: var(--bg-soft);
            padding-top: calc(var(--space-48) + var(--space-8));
            padding-bottom: calc(var(--space-48) + var(--space-8));
        }

        .at-hero__crumb {
            margin: calc(var(--space-24) + var(--space-16)) 0 calc(var(--space-24) + var(--space-8));
            color: var(--text-secondary);
        }

        .at-hero__crumb a {
            color: inherit;
            text-decoration: none;
        }

        .at-hero__crumb a:hover {
            text-decoration: underline;
        }

        .at-hero__title {
            margin: 0 0 calc(var(--space-24) + var(--space-8));
            color: var(--brand-primary);
        }

        .at-hero__desc {
            margin: 0;
            color: var(--text-secondary);
        }

        .at-profile {
            padding-top: calc(var(--space-48) + var(--space-8));
            padding-bottom: calc(var(--space-48) + var(--space-24));
            background-color: var(--bg-white);
            box-sizing: border-box;
            width: 100%;
        }

        .at-profile__grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            align-items: center;
            gap: 60px;
            box-sizing: border-box;
            width: 100%;
        }

        .at-profile__photo {
            width: 360px;
            height: 485px;
            object-fit: cover;
            display: block;
            border-radius: var(--radius-card);
            background-color: var(--bg-gray);
            box-shadow: var(--shadow-card);
            box-sizing: border-box;
        }

        .at-profile__list {
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 18px;
            font-weight: 400;
            line-height: 36px;
            color: var(--text-primary);
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
        }

        .at-profile__list li {
            overflow-wrap: break-word;
        }

        .at-profile__list strong {
            font-weight: 700;
            color: var(--brand-primary);
        }

        /* Responsivitas Tablet & Layar Menengah (<= 1024px) */
        @media (max-width: 1024px) {
            .at-profile .container {
                padding-left: 40px;
                padding-right: 40px;
            }

            .at-profile__grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .at-profile__photo {
                width: 100%;
                max-width: 360px;
                height: auto;
                aspect-ratio: 360 / 485;
                margin: 0 auto;
            }
        }

        /* Responsivitas Smartphone / Android / iPhone (<= 768px) */
        @media (max-width: 768px) {
            .at-profile .container {
                padding-left: 24px;
                padding-right: 24px;
            }

            .at-profile__list {
                font-size: 15px;
                line-height: 1.8;
            }
        }

        /* Responsivitas Perangkat Sangat Kecil / iPhone SE (<= 480px) */
        @media (max-width: 480px) {
            .at-profile .container {
                padding-left: 16px;
                padding-right: 16px;
            }

            .at-profile__list {
                font-size: 14px;
                line-height: 1.6;
            }
        }
    </style>
</head>

<body>

    <div id="navbar-container"></div>

    <div id="carousel-container"></div>

    <section class="at-profile">
        <div class="container at-profile__grid">
            <img class="at-profile__photo" id="instruktur-foto" src="" alt="">
            <ul class="at-profile__list" id="instruktur-detail"></ul>
        </div>
    </section>

    <div id="cta-container"></div>
    <div id="footer-container"></div>

    <script>
        window.current_page = 'pelatihan';
        window.navbar_autorender = false;
        window.carousel_autorender = false;
        window.footer_autorender = false;
    </script>

    <script src="../../../../Components/ctacontainer.js"></script>
    <script src="../../../../Components/button.js"></script>
    <script src="../../../../Components/card.js"></script>
    <script src="../../../../Components/carousel.js"></script>
    <script src="../../../../Components/navbar.js"></script>
    <script src="../../../../Components/footer.js"></script>

    <script>
        (function () {
            "use strict";

            var baseUrl = (typeof window.baseUrl === 'string' && window.baseUrl !== '') ? window.baseUrl : '../../../..';
            var imagesUrl = baseUrl + '/Assets/images/';
            var pelatihanUrl = baseUrl + '/Pages/Pelatihan/index.html';
            var hubungiUrl = baseUrl + '/Pages/HubungiKami/index.html';

            var instrukturKatalog = {
                1: {
                    id: 1,
                    foto: "instruktur-1.jpg",
                    nama: "Nama Instruktur 1",
                    peran: "Web Development",
                    jabatan: "Instruktur Web Development",
                    bidang: "Pemrograman Web Fullstack, HTML/CSS, JavaScript & PHP",
                    npwp: "12.345.678.9-011.000",
                    nidn: "0412038501",
                    email: "instruktur1@jtinova.com",
                    telepon: "+62 812-3456-7891",
                    pendidikan: "S2 Teknik Informatika, Universitas Teknologi Nusantara",
                    sertifikasi: "Certified Web Developer, AWS Certified Cloud Practitioner",
                    pengalaman: "8 Tahun sebagai praktisi industri web dan pengajar aktif di TEFA JTI."
                },
                2: {
                    id: 2,
                    foto: "instruktur-2.jpg",
                    nama: "Nama Instruktur 2",
                    peran: "UI/UX Design",
                    jabatan: "Instruktur UI/UX Design",
                    bidang: "UI/UX Design, Figma, User Research & Design System",
                    npwp: "12.345.678.9-012.000",
                    nidn: "0412038502",
                    email: "instruktur2@jtinova.com",
                    telepon: "+62 812-3456-7892",
                    pendidikan: "S2 Desain Komunikasi Visual, Universitas Teknologi Nusantara",
                    sertifikasi: "Google UX Design Professional Certificate, Adobe Certified Expert",
                    pengalaman: "6 Tahun sebagai product designer dan mentor workshop desain."
                },
                3: {
                    id: 3,
                    foto: "instruktur-3.jpg",
                    nama: "Nama Instruktur 3",
                    peran: "Jaringan & Keamanan",
                    jabatan: "Instruktur Jaringan & Keamanan",
                    bidang: "Infrastruktur Jaringan, Administrasi Server & Keamanan Siber",
                    npwp: "12.345.678.9-013.000",
                    nidn: "0412038503",
                    email: "instruktur3@jtinova.com",
                    telepon: "+62 812-3456-7893",
                    pendidikan: "S2 Teknik Komputer, Universitas Teknologi Nusantara",
                    sertifikasi: "Cisco CCNA, CompTIA Security+, Mikrotik Certified Network Associate",
                    pengalaman: "7 Tahun sebagai network engineer dan instruktur laboratorium jaringan."
                },
                4: {
                    id: 4,
                    foto: "instruktur-4.jpg",
                    nama: "Nama Instruktur 4",
                    peran: "Data & Analitik",
                    jabatan: "Instruktur Data & Analitik",
                    bidang: "Analisis Data, Python, Visualisasi Data & Business Intelligence",
                    npwp: "12.345.678.9-014.000",
                    nidn: "0412038504",
                    email: "instruktur4@jtinova.com",
                    telepon: "+62 812-3456-7894",
                    pendidikan: "S2 Sains Komputasi & Statistik, Universitas Teknologi Nusantara",
                    sertifikasi: "Certified Data Analyst, Microsoft Power BI Certified",
                    pengalaman: "6 Tahun sebagai data specialist dan pengajar bootcamp data."
                }
            };

            var params = new URLSearchParams(window.location.search);
            var rawId = params.get("id");
            var parsedId = rawId !== null ? parseInt(rawId, 10) : 1;
            var orang = instrukturKatalog[parsedId] || instrukturKatalog[1];
            var fotoSrc = imagesUrl + (orang.foto || "dummy.jpg");

            document.title = "Profil Instruktur - " + orang.nama + " - JTI NOVA";

            var navContainer = document.getElementById("navbar-container");
            if (navContainer && typeof window.mountNavbar === "function") {
                window.mountNavbar(navContainer, { current_page: "pelatihan", base_url: baseUrl });
            }

            var carouselSlides = [
                {
                    id: 1,
                    image: fotoSrc,
                    title: orang.nama,
                    description: orang.jabatan + " · " + orang.bidang,
                    buttons: [
                        { text: "Hubungi Kami", link: hubungiUrl, variant: "primary" },
                        { text: "Kembali ke Pelatihan", link: pelatihanUrl + "#instruktur", variant: "outline-white" }
                    ]
                }
            ];

            var carouselContainer = document.getElementById("carousel-container");
            if (carouselContainer && typeof window.mountCarousel === "function") {
                window.mountCarousel(carouselContainer, {
                    carousel_type: "hero",
                    carousel_slides: carouselSlides
                });
            }

            var fotoEl = document.getElementById("instruktur-foto");
            if (fotoEl) {
                fotoEl.src = fotoSrc;
                fotoEl.alt = orang.nama;
                fotoEl.addEventListener("error", function () {
                    if (fotoEl.src.indexOf("dummy.jpg") === -1) {
                        fotoEl.src = imagesUrl + "dummy.jpg";
                    }
                });
            }

            var detailItems = [
                ["Nama Lengkap", orang.nama],
                ["Jabatan", orang.jabatan],
                ["Bidang Keahlian", orang.bidang],
                ["NPWP", orang.npwp],
                ["Nomor Induk / NIDN", orang.nidn],
                ["Email", orang.email],
                ["Nomor Telepon", orang.telepon],
                ["Pendidikan Terakhir", orang.pendidikan],
                ["Riwayat Sertifikasi", orang.sertifikasi],
                ["Pengalaman Profesional", orang.pengalaman]
            ];

            var listEl = document.getElementById("instruktur-detail");
            if (listEl) {
                listEl.textContent = "";
                detailItems.forEach(function (pair) {
                    var li = document.createElement("li");
                    var strong = document.createElement("strong");
                    strong.textContent = pair[0] + ": ";

                    li.appendChild(strong);
                    li.appendChild(document.createTextNode(pair[1]));
                    listEl.appendChild(li);
                });
            }

            var ctaContainer = document.getElementById("cta-container");
            if (ctaContainer && typeof window.mountCta === "function") {
                window.mountCta(ctaContainer, {
                    title: "Tertarik mengikuti pelatihan ini?",
                    subtitle: "Hubungi tim JTI NOVA untuk informasi pendaftaran, jadwal kelas, dan konsultasi program.",
                    btn_text: "Hubungi Kami",
                    btn_href: hubungiUrl,
                    variant: "dark"
                });
            }
            
            var footerContainer = document.getElementById("footer-container");
            if (footerContainer && typeof window.mountFooter === "function") {
                window.mountFooter(footerContainer, { current_page: "pelatihan", base_url: baseUrl });
            }
        })();
    </script>

</body>

</html>

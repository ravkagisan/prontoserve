<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jtinova - Detail Pelatihan</title>

    <link rel="stylesheet" href="../../../../Style/style.css">

    <style>
        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            overflow-x: clip;
            margin: 0;
        }

        .detail {
            background-color: var(--bg-soft);
            width: 100%;
            box-sizing: border-box;
        }

        .detail__top {
            padding-top: calc(var(--space-48) + var(--space-8));
            padding-bottom: 0;
            box-sizing: border-box;
            width: 100%;
        }

        .detail__back {
            display: inline-flex;
            color: var(--text-primary);
            border-radius: 50%;
        }

        .detail__back svg {
            width: 44px;
            height: 44px;
            fill: none;
            stroke: currentColor;
        }

        .detail__back:focus-visible {
            outline: 2px solid var(--brand-teal);
            outline-offset: 3px;
        }

        .detail__crumb {
            margin: var(--space-24) 0 0;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
        }

        .detail__crumb a {
            color: inherit;
            text-decoration: none;
        }

        .detail__crumb a:hover {
            text-decoration: underline;
        }

        .syllabus {
            padding-top: var(--space-24);
            padding-bottom: calc(var(--space-80) + var(--space-48));
            box-sizing: border-box;
            width: 100%;
        }

        .syllabus__head {
            text-align: center;
            margin-bottom: var(--space-24);
            box-sizing: border-box;
        }

        .syllabus__title {
            margin: 0 0 var(--space-8);
            color: var(--brand-primary);
            font-size: clamp(22px, 3.5vw, 28px);
            overflow-wrap: anywhere;
        }

        .syllabus__meta {
            margin: 0;
            font-size: clamp(14px, 2vw, 18px);
            font-weight: 600;
            color: var(--text-primary);
            overflow-wrap: anywhere;
        }

        .syllabus__list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .syllabus__row {
            display: flex;
            align-items: center;
            gap: var(--space-24);
            min-height: 50px;
            padding: 12px var(--space-24);
            border-radius: var(--radius-input);
            background-color: var(--bg-white);
            box-sizing: border-box;
            width: 100%;
        }

        .syllabus__no {
            flex: 0 0 120px;
            font-size: 14px;
            font-weight: 600;
            color: var(--brand-slate);
        }

        .syllabus__topic {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            overflow-wrap: anywhere;
        }

        .syllabus__sum {
            margin: 0;
            font-size: 13.5px;
            color: var(--text-secondary);
            overflow-wrap: break-word;
        }

        .detail-end {
            height: var(--space-80);
        }

        /* Responsivitas Tablet & Layar Menengah (<= 1024px) */
        @media (max-width: 1024px) {
            .detail .container {
                padding-left: 40px;
                padding-right: 40px;
            }
        }

        /* Responsivitas Phablet / Tablet Kecil (<= 768px) */
        @media (max-width: 768px) {
            .detail .container {
                padding-left: 24px;
                padding-right: 24px;
            }

            .syllabus {
                padding-top: var(--space-24);
                padding-bottom: 40px;
            }

            .syllabus__title {
                font-size: 22px;
            }

            .syllabus__meta {
                font-size: 14px;
            }

            .syllabus__row {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                padding: 16px;
            }

            .syllabus__no {
                flex-basis: auto;
            }
        }

        /* Responsivitas Smartphone Kecil / iPhone SE (<= 480px) */
        @media (max-width: 480px) {
            .detail .container {
                padding-left: 16px;
                padding-right: 16px;
            }

            .syllabus__title {
                font-size: 20px;
            }

            .syllabus__meta {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div id="navbar-container"></div>

    <div id="carousel-container"></div>

    <main>
        <div class="detail">
            <div class="container detail__top">
                <a class="detail__back" id="detail-back-link" href="../../index.html#katalog" aria-label="Kembali ke Pelatihan">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M16 12H8M12 8l-4 4 4 4" />
                    </svg>
                </a>
                <p class="caption detail__crumb">
                    <a id="detail-crumb-link" href="../../index.html">Pelatihan</a> / <span id="detail-crumb-current">Detail</span>
                </p>
            </div>

            <section class="container syllabus">
                <div class="syllabus__head">
                    <h2 class="heading-2 syllabus__title" id="syllabus-title">Silabus</h2>
                    <p class="syllabus__meta" id="syllabus-meta"></p>
                </div>
                <div class="syllabus__list" id="syllabus-list"></div>
            </section>
        </div>
        <div class="detail-end"></div>
    </main>

    <div id="cta-container"></div>
    <div id="footer-container"></div>

    <script>
        window.current_page = 'pelatihan';
        window.navbar_autorender = false;
        window.carousel_autorender = false;
        window.footer_autorender = false;
    </script>

    <script src="../../../../Components/ctacontainer.js"></script>
    <script src="../../../../Components/button.js"></script>
    <script src="../../../../Components/card.js"></script>
    <script src="../../../../Components/carousel.js"></script>
    <script src="../../../../Components/navbar.js"></script>
    <script src="../../../../Components/footer.js"></script>

    <script>
        (function () {
            "use strict";

            var baseUrl = (typeof window.baseUrl === 'string' && window.baseUrl !== '') ? window.baseUrl : '../../../..';
            var imagesUrl = baseUrl + '/Assets/images/';
            var pelatihanUrl = baseUrl + '/Pages/Pelatihan';
            var hubungiUrl = baseUrl + '/Pages/HubungiKami/index.html';

            var katalog = [
                {
                    id: 1,
                    singkat: "Pemrograman Full Stack",
                    judul: "Pemrograman Web Fullstack",
                    tanggal: "10 Nov 2026",
                    mentor: "Nama Instruktur",
                    gambar: "pelatihan-web.jpg",
                    silabus: [
                        { pertemuan: "Pertemuan 1", materi: "Dasar HTML & CSS", ringkasan: "Struktur halaman, tipografi, dan layout responsif" },
                        { pertemuan: "Pertemuan 2", materi: "JavaScript Dasar", ringkasan: "Variabel, fungsi, DOM, dan event" },
                        { pertemuan: "Pertemuan 3", materi: "Backend & Database", ringkasan: "REST API, autentikasi, dan basis data" },
                        { pertemuan: "Pertemuan 4", materi: "Proyek Akhir", ringkasan: "Integrasi, pengujian, dan presentasi" }
                    ]
                },
                {
                    id: 2,
                    singkat: "UI/UX Design",
                    judul: "UI/UX Design dengan Figma",
                    tanggal: "24 Nov 2026",
                    mentor: "Nama Instruktur",
                    gambar: "pelatihan-uiux.jpg",
                    silabus: [
                        { pertemuan: "Pertemuan 1", materi: "Dasar UI/UX", ringkasan: "Prinsip desain dan alur kerja desainer" },
                        { pertemuan: "Pertemuan 2", materi: "Riset & Wireframe", ringkasan: "User persona, user flow, dan wireframe" },
                        { pertemuan: "Pertemuan 3", materi: "Desain Visual", ringkasan: "Komponen, warna, tipografi, dan design system" },
                        { pertemuan: "Pertemuan 4", materi: "Proyek Akhir", ringkasan: "Prototipe interaktif dan uji kegunaan" }
                    ]
                },
                {
                    id: 3,
                    singkat: "Dasar Jaringan Komputer",
                    judul: "Dasar Jaringan Komputer",
                    tanggal: "6 Des 2026",
                    mentor: "Nama Instruktur",
                    gambar: "pelatihan-jaringan.jpg",
                    silabus: [
                        { pertemuan: "Pertemuan 1", materi: "Konsep Jaringan", ringkasan: "Model OSI, TCP/IP, dan topologi" },
                        { pertemuan: "Pertemuan 2", materi: "Pengalamatan IP", ringkasan: "IPv4, subnetting, dan routing dasar" },
                        { pertemuan: "Pertemuan 3", materi: "Keamanan Jaringan", ringkasan: "Firewall, autentikasi, dan praktik aman" },
                        { pertemuan: "Pertemuan 4", materi: "Proyek Akhir", ringkasan: "Merancang dan mengonfigurasi jaringan kantor" }
                    ]
                },
                {
                    id: 4,
                    singkat: "Pemrograman Mobile",
                    judul: "Pemrograman Mobile",
                    tanggal: "13 Des 2026",
                    mentor: "Nama Instruktur",
                    gambar: "pelatihan-mobile.jpg",
                    silabus: [
                        { pertemuan: "Pertemuan 1", materi: "Dasar Mobile", ringkasan: "Lingkungan kerja dan komponen antarmuka" },
                        { pertemuan: "Pertemuan 2", materi: "Navigasi & State", ringkasan: "Perpindahan layar dan pengelolaan state" },
                        { pertemuan: "Pertemuan 3", materi: "Data & API", ringkasan: "Penyimpanan lokal dan konsumsi REST API" },
                        { pertemuan: "Pertemuan 4", materi: "Proyek Akhir", ringkasan: "Menyusun dan mempresentasikan aplikasi" }
                    ]
                },
                {
                    id: 5,
                    singkat: "Data & Analitik",
                    judul: "Data & Analitik",
                    tanggal: "20 Des 2026",
                    mentor: "Nama Instruktur",
                    gambar: "pelatihan-data.jpg",
                    silabus: [
                        { pertemuan: "Pertemuan 1", materi: "Pengantar Data", ringkasan: "Jenis data dan alur analisis" },
                        { pertemuan: "Pertemuan 2", materi: "Pembersihan Data", ringkasan: "Menangani data kosong, duplikat, dan outlier" },
                        { pertemuan: "Pertemuan 3", materi: "Visualisasi", ringkasan: "Grafik dan dashboard yang informatif" },
                        { pertemuan: "Pertemuan 4", materi: "Proyek Akhir", ringkasan: "Analisis data nyata dan presentasi temuan" }
                    ]
                },
                {
                    id: 6,
                    singkat: "Coding for Kids",
                    judul: "Coding for Kids",
                    tanggal: "3 Jan 2027",
                    mentor: "Nama Instruktur",
                    gambar: "pelatihan-kids.jpg",
                    silabus: [
                        { pertemuan: "Pertemuan 1", materi: "Mengenal Logika", ringkasan: "Urutan perintah dan pola sederhana" },
                        { pertemuan: "Pertemuan 2", materi: "Animasi", ringkasan: "Membuat tokoh dan gerakan" },
                        { pertemuan: "Pertemuan 3", materi: "Permainan", ringkasan: "Membuat game sederhana" },
                        { pertemuan: "Pertemuan 4", materi: "Pameran Karya", ringkasan: "Menampilkan karya kepada orang tua" }
                    ]
                }
            ];

            // Ambil parameter ?id= dari URL
            var params = new URLSearchParams(window.location.search);
            var rawId = params.get("id");
            var id = rawId !== null ? parseInt(rawId, 10) : 1;

            var kursus = null;
            for (var i = 0; i < katalog.length; i++) {
                if (katalog[i].id === id) {
                    kursus = katalog[i];
                    break;
                }
            }

            if (!kursus) {
                window.location.replace(pelatihanUrl + "/index.html#katalog");
                return;
            }

            // Update judul tab & tautan navigasi
            document.title = "jtinova - " + kursus.judul;

            var backLink = document.getElementById("detail-back-link");
            if (backLink) backLink.href = pelatihanUrl + "/index.html#katalog";

            var crumbLink = document.getElementById("detail-crumb-link");
            if (crumbLink) crumbLink.href = pelatihanUrl + "/index.html";

            var crumbCurrent = document.getElementById("detail-crumb-current");
            if (crumbCurrent) crumbCurrent.textContent = kursus.singkat;

            // Mount Navbar
            var navContainer = document.getElementById("navbar-container");
            if (navContainer && typeof window.mountNavbar === "function") {
                window.mountNavbar(navContainer, { current_page: "pelatihan", base_url: baseUrl });
            }

            // Siapkan Carousel
            var kursusImage = imagesUrl + (kursus.gambar || "dummy.jpg");
            var carouselSlides = [
                {
                    id: kursus.id,
                    image: kursusImage,
                    title: kursus.judul,
                    description: "Pelatihan dan sertifikasi IT terpadu untuk berbagai kebutuhan profesional.",
                    buttons: [
                        { text: "Daftar Pelatihan", link: hubungiUrl, variant: "primary" },
                        { text: "Kembali ke Katalog", link: pelatihanUrl + "/index.html#katalog", variant: "outline-white" }
                    ]
                },
                {
                    id: "overview",
                    image: imagesUrl + "ajasendiri.jpg",
                    title: "Program Pelatihan IT\nProfesional & Tersertifikasi",
                    description: "Tingkatkan keahlian teknologi Anda melalui kurikulum berbasis industri langsung bersama instruktur ahli.",
                    buttons: [
                        { text: "Hubungi Kami", link: hubungiUrl, variant: "primary" },
                        { text: "Kembali ke Katalog", link: pelatihanUrl + "/index.html#katalog", variant: "outline-white" }
                    ]
                }
            ];

            var carouselContainer = document.getElementById("carousel-container");
            if (carouselContainer && typeof window.mountCarousel === "function") {
                window.mountCarousel(carouselContainer, {
                    carousel_type: "hero",
                    carousel_slides: carouselSlides
                });
            }

            // Render Header & Daftar Silabus
            var titleEl = document.getElementById("syllabus-title");
            if (titleEl) {
                titleEl.textContent = "Silabus: " + kursus.judul;
            }

            var metaEl = document.getElementById("syllabus-meta");
            if (metaEl) {
                var iconSpan = document.createElement("span");
                iconSpan.setAttribute("aria-hidden", "true");
                iconSpan.textContent = "\uD83D\uDCC6 ";

                metaEl.textContent = "";
                metaEl.appendChild(iconSpan);
                metaEl.appendChild(document.createTextNode("Jadwal: " + kursus.tanggal + " \u00B7 Mentor: " + kursus.mentor));
            }

            var listEl = document.getElementById("syllabus-list");
            if (listEl) {
                listEl.textContent = "";
                kursus.silabus.forEach(function (baris) {
                    var row = document.createElement("div");
                    row.className = "syllabus__row";

                    var no = document.createElement("span");
                    no.className = "syllabus__no";
                    no.textContent = baris.pertemuan;

                    var topic = document.createElement("p");
                    topic.className = "syllabus__topic";
                    topic.textContent = baris.materi;

                    var sum = document.createElement("p");
                    sum.className = "syllabus__sum";
                    sum.textContent = baris.ringkasan;

                    row.appendChild(no);
                    row.appendChild(topic);
                    row.appendChild(sum);
                    listEl.appendChild(row);
                });
            }

            var ctaContainer = document.getElementById("cta-container");
            if (ctaContainer && typeof window.mountCta === "function") {
                window.mountCta(ctaContainer, {
                    title: "Tertarik mengikuti pelatihan ini?",
                    subtitle: "Hubungi tim JTI NOVA untuk informasi pendaftaran, jadwal kelas, dan konsultasi program.",
                    btn_text: "Hubungi Kami",
                    btn_href: hubungiUrl,
                    variant: "dark"
                });
            }
            // Mount Footer
            var footerContainer = document.getElementById("footer-container");
            if (footerContainer && typeof window.mountFooter === "function") {
                window.mountFooter(footerContainer, { current_page: "pelatihan", base_url: baseUrl });
            }
        })();
    </script>

</body>

</html>

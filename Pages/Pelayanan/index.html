<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jtinova - Pelayanan</title>

    <link rel="stylesheet" href="../../Style/style.css" />

    <style>
      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        overflow-x: clip;
        margin: 0;
      }

      .pl-hero {
        background-color: var(--bg-soft);
        padding-top: calc(var(--space-48) + var(--space-8));
        padding-bottom: calc(var(--space-48) + var(--space-8));
      }

      .pl-hero__crumb {
        margin: 0 0 calc(var(--space-24) + var(--space-8));
        color: var(--text-secondary);
      }

      .pl-hero__crumb a {
        color: inherit;
        text-decoration: none;
      }

      .pl-hero__crumb a:hover {
        text-decoration: underline;
      }

      .pl-hero__title {
        margin: 0 0 calc(var(--space-24) + var(--space-8));
        color: var(--brand-primary);
      }

      .pl-hero__desc {
        margin: 0;
        color: var(--text-secondary);
      }

      .pl-section {
        padding-top: calc(var(--space-48) + var(--space-16));
        padding-bottom: calc(var(--space-48) + var(--space-16));
      }

      .pl-section--soft {
        background-color: var(--bg-soft);
      }

      .pl-section--tight {
        padding-top: var(--space-48);
        padding-bottom: var(--space-48);
      }

      .pl-head {
        text-align: center;
        margin-bottom: calc(var(--space-24) + var(--space-8));
      }

      .pl-head__title {
        margin: 0 0 var(--space-8);
        color: var(--brand-primary);
        font-size: clamp(24px, 3.5vw, 32px);
      }

      .pl-head__sub {
        margin: 0;
        color: var(--text-secondary);
        font-size: clamp(14px, 1.5vw, 16px);
      }

      .service-grid,
      .info-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-24);
        width: 100%;
        box-sizing: border-box;
      }

      .service-grid .card-inner {
        padding: 20px;
      }

      .service-grid .card-img-inset-wrap {
        height: 140px;
      }

      .service-grid .card-desc {
        font-size: 14px;
        line-height: 17px;
        margin-bottom: 12px;
        overflow-wrap: break-word;
      }

      .service-grid .card-contact-info {
        font-size: 13px;
        font-weight: 400;
        color: var(--brand-primary);
        margin-bottom: 12px;
      }

      .steps-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--space-24);
        width: 100%;
        box-sizing: border-box;
      }

      .step {
        padding: 20px;
        height: 100%;
        box-sizing: border-box;
      }

      .step__no {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        margin-bottom: var(--space-8);
        border-radius: 50%;
        background-color: var(--brand-primary);
        color: var(--bg-white);
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .step__title {
        margin: 0 0 var(--space-8);
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        overflow-wrap: anywhere;
      }

      .step__text {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--text-secondary);
        overflow-wrap: break-word;
      }

      .info-card {
        padding: 20px;
        border: 1px solid var(--border-default);
        height: 100%;
        box-sizing: border-box;
      }

      .info-card__icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        margin-bottom: var(--space-8);
        border-radius: 50%;
        background-color: var(--bg-soft);
        font-size: 16px;
        flex-shrink: 0;
      }

      .info-card__title {
        margin: 0 0 var(--space-8);
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .info-card__text {
        margin: 0;
        font-size: 13px;
        color: var(--text-secondary);
        overflow-wrap: anywhere;
      }

      /* Responsivitas Tablet & Perangkat Menengah (<= 1024px) */
      @media (max-width: 1024px) {
        .container {
          padding-left: 40px;
          padding-right: 40px;
        }

        .service-grid,
        .info-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 20px;
        }

        .steps-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 20px;
        }
      }

      /* Responsivitas Tablet Kecil / Phablet (<= 768px) */
      @media (max-width: 768px) {
        .container {
          padding-left: 24px;
          padding-right: 24px;
        }

        .pl-hero__title {
          font-size: 28px;
        }

        .pl-section {
          padding-top: 36px;
          padding-bottom: 36px;
        }
      }

      /* Responsivitas Smartphone / Android / iPhone (<= 640px) */
      @media (max-width: 640px) {
        .container {
          padding-left: 16px;
          padding-right: 16px;
        }

        .service-grid,
        .info-grid,
        .steps-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .pl-head {
          margin-bottom: 20px;
        }
      }

      /* Responsivitas Layar Sangat Kecil / iPhone SE (<= 480px) */
      @media (max-width: 480px) {
        .container {
          padding-left: 16px;
          padding-right: 16px;
        }

        .pl-hero__title {
          font-size: 24px;
        }

        .pl-head__title {
          font-size: 22px;
        }
      }
    </style>
  </head>

        var navContainer = document.getElementById("navbar-container");
        if (navContainer && typeof window.mountNavbar === "function") {
          window.mountNavbar(navContainer, {

          });
        }

        var carouselContainer = document.getElementById("carousel-container");
        if (carouselContainer && typeof window.mountCarousel === "function") {
          window.mountCarousel(carouselContainer, {
            carousel_type: "hero",
            carousel_slides: carouselSlides,
          });
        }

        function renderLayanan() {
          var grid = document.getElementById("service-grid");
          if (!grid || typeof window.renderCard !== "function") return;

          grid.innerHTML = layanan
            .map(function (item) {
              return window.renderCard({
                variant: "service",
                title: item.judul,
                description: item.deskripsi,
                image: imagesUrl + item.gambar,
                extra_info: "Kontak: " + kontakLayanan,
                href: item.href,
              });
            })
            .join("");
        }

        function renderAlur() {
          var grid = document.getElementById("steps-grid");
          if (!grid) return;

          grid.textContent = "";
          alur.forEach(function (langkah, index) {
            var article = document.createElement("article");
            article.className = "card step";

            var no = document.createElement("span");
            no.className = "step__no";
            no.textContent = String(index + 1);

            var h3 = document.createElement("h3");
            h3.className = "step__title";
            h3.textContent = langkah.judul;

            var p = document.createElement("p");
            p.className = "step__text";
            p.textContent = langkah.teks;

            article.appendChild(no);
            article.appendChild(h3);
            article.appendChild(p);
            grid.appendChild(article);
          });
        }

        function renderKontak() {
          var grid = document.getElementById("info-grid");
          if (!grid) return;

          grid.textContent = "";
          kontak.forEach(function (info) {
            var article = document.createElement("article");
            article.className = "card info-card";

            var icon = document.createElement("span");
            icon.className = "info-card__icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = info.ikon;

            var h3 = document.createElement("h3");
            h3.className = "info-card__title";
            h3.textContent = info.judul;

            var p = document.createElement("p");
            p.className = "info-card__text";
            p.textContent = info.nilai;

            article.appendChild(icon);
            article.appendChild(h3);
            article.appendChild(p);
            grid.appendChild(article);
          });
        }

        renderLayanan();
        renderAlur();
        renderKontak();

        var ctaContainer = document.getElementById("cta-container");

</html>
